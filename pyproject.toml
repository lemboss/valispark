[project]
name = "valipark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyspark>=3.5.8,<4",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["."]
